name: Diagnostic serveur

# Lit les journaux des fonctions et l'etat du domaine d'envoi Resend,
# sans PC (27/09). Se lance quand tools/diagnostic/demande.txt change.
# Aucune cle n'est affichee.

on:
  push:
    branches: [main]
    paths:
      - 'tools/diagnostic/demande.txt'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cle du compte de service
        env:
          CLE: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          printf '%s' "$CLE" > "$RUNNER_TEMP/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cle.json" >> "$GITHUB_ENV"
      - name: Journaux mailVerification
        run: npx --yes firebase-tools@latest functions:log --only mailVerification --project repz-baf60 2>&1 | tail -60 || true
      - name: Journaux espaceCoach
        run: npx --yes firebase-tools@latest functions:log --only espaceCoach --project repz-baf60 2>&1 | tail -40 || true
      - name: Domaine Resend
        run: |
          RESEND_CLE=$(npx --yes firebase-tools@latest functions:secrets:access RESEND_API_KEY --project repz-baf60 2>/dev/null) node tools/diagnostic/resend.mjs || true
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/cle.json"
