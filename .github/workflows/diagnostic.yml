name: Diagnostic serveur

# Lit les journaux des fonctions et l'etat du domaine d'envoi Resend,
# sans PC (27/09). Se lance quand tools/diagnostic/demande.txt change.
# Aucune cle n'est affichee.

on:
  push:
    branches: [main]
    paths:
      - 'tools/diagnostic/demande.txt'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cle du compte de service
        env:
          CLE: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          printf '%s' "$CLE" > "$RUNNER_TEMP/cle.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/cle.json" >> "$GITHUB_ENV"
      # Sortie chiffree (cle publique du depot) puis poussee sur la branche
      # diagnostic-sortie : les journaux contiennent des adresses e-mail et
      # le depot est public. Seul le detenteur de la cle privee peut lire.
      - name: Collecte
        run: |
          {
            echo "=== mailVerification ==="
            npx --yes firebase-tools@latest functions:log --only mailVerification --project repz-baf60 2>&1 | tail -80 || true
            echo "=== espaceCoach ==="
            npx --yes firebase-tools@latest functions:log --only espaceCoach --project repz-baf60 2>&1 | tail -60 || true
            echo "=== Erreurs detaillees (24 h) ==="
            gcloud auth activate-service-account --key-file="$RUNNER_TEMP/cle.json" >/dev/null 2>&1 || true
            gcloud logging read 'resource.type="cloud_run_revision" AND (resource.labels.service_name="espacecoach" OR resource.labels.service_name="mailverification") AND severity>=WARNING AND timestamp>="'"$(date -u -d '-24 hours' +%FT%TZ)"'"' --project repz-baf60 --limit 30 --format='value(timestamp,resource.labels.service_name,severity,textPayload,jsonPayload.message)' 2>&1 | cut -c1-400 || true
            echo "=== Requetes HTTP (24 h) ==="
            gcloud logging read 'resource.type="cloud_run_revision" AND (resource.labels.service_name="espacecoach" OR resource.labels.service_name="mailverification") AND httpRequest.status>0 AND timestamp>="'"$(date -u -d '-24 hours' +%FT%TZ)"'"' --project repz-baf60 --limit 30 --format='value(timestamp,resource.labels.service_name,httpRequest.status,httpRequest.latency)' 2>&1 || true
            echo "=== Resend ==="
            RESEND_CLE=$(npx --yes firebase-tools@latest functions:secrets:access RESEND_API_KEY --project repz-baf60 2>/dev/null) node tools/diagnostic/resend.mjs 2>&1 || true
          } > "$RUNNER_TEMP/sortie.txt"
          openssl rand -hex 32 > "$RUNNER_TEMP/k.txt"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/sortie.txt" -out "$RUNNER_TEMP/sortie.enc" -pass file:"$RUNNER_TEMP/k.txt"
          openssl pkeyutl -encrypt -pubin -inkey tools/diagnostic/cle-publique.pem -in "$RUNNER_TEMP/k.txt" -out "$RUNNER_TEMP/k.enc"
          mkdir -p "$RUNNER_TEMP/out" && cp "$RUNNER_TEMP/sortie.enc" "$RUNNER_TEMP/k.enc" "$RUNNER_TEMP/out/"
          cd "$RUNNER_TEMP/out"
          git init -q && git checkout -q -b diagnostic-sortie
          git config user.email "coach@belfit.be" && git config user.name "BelFit Diagnostic"
          git add . && git commit -qm "diagnostic $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diagnostic-sortie
          rm -f "$RUNNER_TEMP/sortie.txt" "$RUNNER_TEMP/k.txt"
      - name: Nettoyage
        if: always()
        run: rm -f "$RUNNER_TEMP/cle.json"
