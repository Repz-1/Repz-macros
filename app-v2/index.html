<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icon-192-v7.png">
<title>BelFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f%5B%5D=satoshi@300,400,500,700,800,900&f%5B%5D=dm-mono@400,500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#F4F3F0;font-family:'Satoshi','Manrope',sans-serif;color:#181818}
  #splash{position:fixed;inset:0;z-index:9999;background:#F4F3F0;display:flex;align-items:center;justify-content:center;transition:opacity .25s ease}
  /* Symbole centre, nom en pied d'ecran : on ne lit pas un splash, le
     nom n'est qu'une signature (Raci, 8/08). */
  #splash .sp-sym{width:200px;height:auto}
  #splash .sp-nom{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(48px + env(safe-area-inset-bottom));width:190px;height:auto}
  #splash.parti{opacity:0;pointer-events:none}
</style>
</head>
<body>
<!-- Splash : reste jusqu'au premier rendu. Fond clair depuis le 8/08
     (Raci) : meme valeur que le fond de l'app, donc aucun flash entre le
     splash et le premier ecran. -->
<div id="splash">
  <img class="sp-sym" src="/belfit-logo-bf.png" alt="BelFit">
  <img class="sp-nom" src="/belfit-nom.png" alt="BelFit — Fitness, Nutrition, Bien-être">
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gradOr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC933"/>
      <stop offset="100%" stop-color="#F7B500"/>
    </linearGradient>
  </defs>
</svg>
<div id="app"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  // Service worker : ouverture instantanee depuis le cache
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      // Pas de rechargement automatique a la mise a jour. Ce reflexe
      // datait d'un HTML servi depuis le cache ; il est reseau-d'abord
      // depuis (sw.js, cache:'reload') : la page qu'on vient d'ouvrir
      // est DEJA la plus recente. Le reload ne faisait plus qu'une
      // chose — relancer l'app sous les yeux de l'utilisateur a chaque
      // deploiement, comme s'il l'avait ouverte deux fois de suite.
      // Le nouveau service worker s'installe en silence (skipWaiting +
      // claim) et servira le prochain lancement.
      navigator.serviceWorker.register('sw.js', { scope: '/v2/' }).catch(function(){});
    });
  }
</script>
</body>
</html>
