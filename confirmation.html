<!DOCTYPE html>
<html lang="fr">
<head>
<script src="i18n-strings.js?v=38"></script>
<script src="i18n.js?v=4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>html{background:#F5F6F8!important;margin:0}
body{margin:0!important;background:radial-gradient(150% 380px at 50% 0,#fbf3dc 0%,#F5F6F8 100%)!important}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7efd9">
<meta name="robots" content="noindex">
<title>BELFIT — Confirme ton adresse</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --orange:#F7B500; --green:#8F6200; --bg:#F5F6F8; --card:#ffffff;
    --dark:#1f2937; --line:#e5e7eb; --text:#1a1a1a; --text-dim:#6b7280; --radius:20px;
}
body {
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:12px;
    display:flex; align-items:center; justify-content:center;
    /* Optiquement, un bloc parfaitement centre parait trop haut :
       on le descend un peu pour equilibrer le regard. */
    padding-top:96px;
}
/* Ecrans peu hauts : la carte se cale en haut au lieu d'etre coupee,
   avec un leger retrait pour ne pas coller au bord superieur. */
@media (max-height:780px){
    body { align-items:flex-start; padding-top:56px; padding-bottom:8px; }
    .auth-container { padding:20px 22px 20px; }
    .auth-logo { width:54px; margin-bottom:8px; }
    .auth-title { font-size:24px; }
    .auth-header { margin-bottom:12px; }
}

.auth-container {
    background:var(--card); border-radius:24px; padding:26px 24px 24px;
    max-width:400px; width:100%;
    box-shadow:0 1px 2px rgba(24,24,24,.05), 0 8px 24px rgba(24,24,24,.08), 0 20px 48px rgba(184,141,16,.10);
}

.auth-header {
    text-align:center; margin-bottom:16px;
}

.auth-logo {
    width:62px; height:auto; margin:0 auto 10px; display:block;
    filter:drop-shadow(0 4px 16px rgba(247,181,0,.18));
}

.auth-title {
    font-size:26px; font-weight:800; letter-spacing:.04em; margin-bottom:4px;
}

.auth-subtitle {
    font-size:14px; color:var(--text-dim); font-weight:600;
}

.pw-meter { height:5px; background:#EEF0F3; border-radius:5px; margin-top:8px; overflow:hidden; }
.pw-bar { height:100%; width:0; border-radius:5px; transition:width .25s, background .25s; }
.pw-hint { font-size:11.5px; color:#9aa0aa; margin-top:6px; font-weight:600; }
.form-group {
    margin-bottom:12px;
}

.label {
    display:block; font-size:12.5px; font-weight:700; margin-bottom:5px;
}

.input {
    width:100%; box-sizing:border-box; padding:12px 13px; border:1.5px solid var(--line);
    border-radius:12px; font-size:15px; font-family:inherit; background:#FFFFFF;
    transition:border-color .16s ease, background .16s ease, box-shadow .16s ease;
}
.pw-wrap { position:relative; }
.pw-wrap .input { padding-right:46px; }
.pw-eye { position:absolute; top:50%; right:6px; transform:translateY(-50%); width:36px; height:36px; border:none; background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#9ca3af; padding:0; }
.pw-eye svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.pw-eye:active { color:#181818; }

.input:focus {
    outline:none; border-color:var(--orange); background:#FFFBEF;
    box-shadow:0 0 0 3px rgba(247,181,0,.14);
}

.btn {
    width:100%; box-sizing:border-box; min-height:48px;
    padding:13px; border:none; border-radius:14px; font-size:15px;
    font-weight:700; cursor:pointer;
    transition:transform .16s cubic-bezier(.22,.8,.28,1), box-shadow .16s ease, background .16s ease;
}

.btn-primary {
    background:linear-gradient(180deg,#FFC933 0%,#F7B500 100%); color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 1px 2px rgba(24,24,24,.07), 0 6px 16px rgba(247,181,0,.26);
}

.btn-primary:active {
    transform:translateY(1px) scale(.995);
    background:linear-gradient(180deg,#F7B500 0%,#E9A800 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 1px 2px rgba(24,24,24,.09), 0 3px 9px rgba(247,181,0,.22);
}

.btn-primary:disabled {
    opacity:.5; cursor:not-allowed;
}

.toggle-form {
    text-align:center; margin-top:14px; font-size:13.5px; color:var(--text-dim);
}

.toggle-form a {
    color:#8F6200; font-weight:800; text-decoration:none; cursor:pointer;
    padding:2px 2px; border-radius:6px;
}
.toggle-form a:active { background:#FFF6DC; }

.error {
    background:#fee2e2; color:#991b1b; padding:12px; border-radius:8px; margin-bottom:16px;
    font-size:13px; display:none;
}

.error.show {
    display:block;
}

/* Message de reussite : memes teintes que l'ecran de connexion. */
.success {
    background:#FFFCF0; color:#166534; padding:12px; border-radius:8px; margin-bottom:16px;
    font-size:13px;
}

.loading {
    display:none; text-align:center; color:var(--orange); font-size:13px;
}

.loading.show {
    display:block;
}

/* Les trois ecrans de la page : verification, formulaire, resultat.
   Un seul est visible a la fois, comme les formulaires d'index.html. */
.vue { display:none; }
.vue.active { display:block; }
</style>
</head>
<body>

<div class="auth-container">
    <div class="auth-header">
        <img src="belfit-logo-b.png" class="auth-logo" alt="BELFIT">
        <div class="auth-title">BEL<span style="color:#DFA004">FIT</span></div>
        <p class="auth-subtitle" id="sousTitre" data-i18n="conf_titre">Plus qu'une étape</p>
    </div>

    <div class="error" id="msgErreur"></div>
    <div class="success" id="msgOk" style="display:none"></div>

    <p id="explication" style="font-size:14.5px; line-height:1.55; color:#5C5750; text-align:center; margin-bottom:16px;"></p>

    <button type="button" class="btn btn-primary" id="btnFait" data-i18n="conf_fait">J'ai confirmé</button>

    <div class="toggle-form">
        <a id="btnRenvoyer" data-i18n="conf_renvoyer">Renvoyer l'e-mail</a>
    </div>
    <p style="font-size:12.5px; color:#a5a19a; text-align:center; margin-top:6px;" data-i18n="conf_spam">Le message peut mettre une minute à arriver.</p>

    <div class="toggle-form toggle-form--discret" style="margin-top:10px">
        <a id="btnAutre" data-i18n="conf_autre">Ce n'est pas la bonne adresse ?</a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAN07MM-t2wIPSwoo0shrV1OfMfIDC-Z0I",
  authDomain: "repz-baf60.firebaseapp.com",
  projectId: "repz-baf60",
  storageBucket: "repz-baf60.firebasestorage.app",
  messagingSenderId: "403252293048",
  appId: "1:403252293048:web:e7db6aed4ba92f0ebfb34d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const API_VERIF = 'https://europe-west1-repz-baf60.cloudfunctions.net/mailVerification';
let envoiFait = false;

function langue(){
  try { return (window.BELFIT_I18N && BELFIT_I18N.getLang()) || 'fr'; } catch(e){ return 'fr'; }
}
function afficherErreur(cle){
  const d = document.getElementById('msgErreur');
  d.textContent = window.t(cle); d.classList.add('show');
  document.getElementById('msgOk').style.display = 'none';
}
function afficherOk(cle){
  const d = document.getElementById('msgOk');
  d.textContent = window.t(cle); d.style.display = 'block';
  document.getElementById('msgErreur').classList.remove('show');
}

async function envoyer(){
  const u = auth.currentUser;
  if(!u) return;
  const jeton = await u.getIdToken();
  const r = await fetch(API_VERIF, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + jeton },
    body: JSON.stringify({ langue: langue() })
  });
  if(r.status === 429) throw new Error('trop_tot');
  if(!r.ok) throw new Error('envoi');
}

// La confirmation se fait souvent sur un autre appareil : on relit
// l'etat du compte regulierement plutot que d'attendre un clic.
async function relire(){
  const u = auth.currentUser;
  if(!u) return false;
  await u.reload();
  if(auth.currentUser && auth.currentUser.emailVerified){
    location.replace('main.html');
    return true;
  }
  return false;
}

auth.onAuthStateChanged(function(u){
  if(!u){ location.replace('index.html'); return; }
  if(u.emailVerified){ location.replace('main.html'); return; }

  document.getElementById('explication').textContent =
    window.t('conf_intro').replace('{email}', u.email || '');

  if(!envoiFait){
    envoiFait = true;
    envoyer().catch(function(){});
  }
  setInterval(function(){ relire().catch(function(){}); }, 5000);
});

document.getElementById('btnFait').addEventListener('click', async function(){
  const b = this;
  b.disabled = true; b.textContent = window.t('conf_verif');
  const ok = await relire().catch(function(){ return false; });
  if(!ok){
    afficherErreur('conf_pas_encore');
    b.disabled = false; b.textContent = window.t('conf_fait');
  }
});

document.getElementById('btnRenvoyer').addEventListener('click', async function(){
  try { await envoyer(); afficherOk('conf_renvoye'); }
  catch(e){ afficherErreur(e.message === 'trop_tot' ? 'conf_trop_tot' : 'conf_erreur'); }
});

// Sortie de secours : une adresse mal tapee enfermerait sinon la
// personne dehors, sans aucun moyen de se rattraper.
document.getElementById('btnAutre').addEventListener('click', function(){
  auth.signOut().then(function(){ location.replace('index.html'); });
});
</script>
</body>
</html>
