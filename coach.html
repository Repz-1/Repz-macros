<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Espace coach — BELFIT</title>
<link rel="icon" href="/belfit-logo-b.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ESPACE COACH — dépôt d'un programme.
   Page volontairement hors de l'application : elle n'a rien à
   faire dans le bundle client, et son accès est vérifié côté
   serveur par deposerProgramme, pas ici. Ce que cette page
   affiche ou masque n'est qu'un confort — la règle est la
   Cloud Function.
   Même matière que l'app : crème, cartes blanches, graphite pour
   l'action qui engage.
   ============================================================ */
:root{
  --fond:#F4F3F0; --carte:#fff; --bord:rgba(28,24,18,.055);
  --filet:rgba(28,24,18,.07);
  --tx:#16130F; --tx2:#57514A; --tx3:#8A8279;
  --or:#F86A0C; --or-lis:#B34700;
  --omb:0 1px 2px rgba(40,32,22,.04), 0 3px 10px rgba(40,32,22,.035);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--tx);
  font-family:'Satoshi','Manrope',system-ui,sans-serif}
.enveloppe{max-width:520px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:10px;padding:4px 0 18px}
header img{height:32px;width:auto;display:block}
header b{font-size:15px;font-weight:600;letter-spacing:-.01em}
header span{margin-left:auto;font-size:11.5px;color:var(--tx3)}
h1{margin:0 0 4px;font-size:28px;font-weight:700;letter-spacing:-.035em}
.sous{margin:0 0 20px;font-size:14px;line-height:1.45;color:var(--tx2)}
.carte{background:var(--carte);border:1px solid var(--bord);
  border-radius:18px;box-shadow:var(--omb);padding:16px;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--tx3);text-transform:uppercase;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);
  background:#FFFDF9;border:1px solid #EDE5D8;border-radius:12px;
  padding:12px 13px;outline:none}
input:focus,textarea:focus{border-color:rgba(248,106,12,.38);
  box-shadow:0 0 0 2.5px rgba(248,106,12,.09)}
textarea{resize:vertical;min-height:78px;line-height:1.5}
.champ+.champ{margin-top:13px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.aide{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--tx3)}
button{display:block;width:100%;font:inherit;font-size:15px;font-weight:600;
  cursor:pointer;color:#F4F6F8;border:none;border-radius:14px;padding:15px;
  background:linear-gradient(168deg,#252B36 0%,#1E232D 58%,#171C24 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(18,22,28,.16)}
button:disabled{opacity:.5;cursor:default}
button:active:not(:disabled){box-shadow:inset 0 3px 9px rgba(0,0,0,.3)}
.msg{margin-top:14px;padding:13px 14px;border-radius:13px;font-size:13.5px;
  line-height:1.5;display:none}
.msg.ok{display:block;background:#E9F5EE;color:#1C5334;
  box-shadow:inset 0 0 0 1px rgba(28,83,52,.12)}
.msg.ko{display:block;background:#FDECEA;color:#8A2318;
  box-shadow:inset 0 0 0 1px rgba(138,35,24,.12)}
.recap{margin-top:12px;padding:14px;border-radius:13px;background:#1E232D;
  color:#F4F6F8;display:none}
.recap.on{display:block}
.recap-l{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.recap-l em{font-style:normal;color:#AAB1BC}
.deco{text-align:center;margin-top:18px;font-size:12px}
.deco a{color:var(--or-lis);font-weight:600}
#connexion{display:none}
#travail{display:none}
</style>
</head>
<body>
<div class="enveloppe">

  <header>
    <img src="/belfit-logo-b.png" alt="BELFIT">
    <b>Espace coach</b>
    <span id="qui"></span>
  </header>

  <!-- Connexion -->
  <section id="connexion">
    <h1>Connexion</h1>
    <p class="sous">Réservé aux coachs BELFIT.</p>
    <div class="carte">
      <div class="champ">
        <label for="cEmail">Adresse e-mail</label>
        <input id="cEmail" type="email" autocomplete="username" inputmode="email">
      </div>
      <div class="champ">
        <label for="cMdp">Mot de passe</label>
        <input id="cMdp" type="password" autocomplete="current-password">
      </div>
    </div>
    <button id="btnConnexion">Se connecter</button>
    <div id="msgCo" class="msg"></div>
  </section>

  <!-- Dépôt -->
  <section id="travail">
    <h1>Déposer un programme</h1>
    <p class="sous">Le plan est écrit dans l'application du client et lui est
      envoyé par e-mail. Une seule action, les deux canaux.</p>

    <div class="carte">
      <div class="champ">
        <label for="client">Client</label>
        <input id="client" type="text" placeholder="e-mail ou pseudo" autocapitalize="off" spellcheck="false">
        <p class="aide">Les deux fonctionnent : <b>raci@exemple.be</b> ou <b>raci</b>.</p>
      </div>
    </div>

    <div class="carte">
      <div class="champ">
        <label for="kcal">Calories par jour</label>
        <input id="kcal" type="number" inputmode="numeric" min="800" max="8000">
      </div>
      <div class="champ grille">
        <div>
          <label for="prot">Protéines (g)</label>
          <input id="prot" type="number" inputmode="numeric" min="20" max="600">
        </div>
        <div>
          <label for="carbs">Glucides (g)</label>
          <input id="carbs" type="number" inputmode="numeric" min="20" max="1200">
        </div>
      </div>
      <div class="champ grille">
        <div>
          <label for="lip">Lipides (g)</label>
          <input id="lip" type="number" inputmode="numeric" min="10" max="400">
        </div>
        <div>
          <label for="langue">Langue de l'e-mail</label>
          <input id="langue" type="text" value="fr" maxlength="2" autocapitalize="off">
        </div>
      </div>
      <p class="aide" id="controle"></p>
    </div>

    <div class="carte">
      <div class="champ">
        <label for="note">Note pour le client</label>
        <textarea id="note" maxlength="600" placeholder="Facultatif — contexte, durée, prochaine étape…"></textarea>
      </div>
    </div>

    <button id="btnEnvoi">Déposer et envoyer</button>
    <div id="msg" class="msg"></div>
    <div id="recap" class="recap"></div>

    <p class="deco"><a href="#" id="btnDeco">Se déconnecter</a></p>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAN07MM-t2wIPSwoo0shrV1OfMfIDC-Z0I",
  authDomain: "repz-baf60.firebaseapp.com",
  projectId: "repz-baf60",
  storageBucket: "repz-baf60.firebasestorage.app",
  messagingSenderId: "403252293048",
  appId: "1:403252293048:web:e7db6aed4ba92f0ebfb34d"
});
var auth = firebase.auth();
var URL_DEPOT = "https://europe-west1-repz-baf60.cloudfunctions.net/deposerProgramme";

var $ = function (id) { return document.getElementById(id); };

function afficher(el, texte, ok) {
  el.textContent = texte;
  el.className = "msg " + (ok ? "ok" : "ko");
}

// --- Contrôle de cohérence, en direct -------------------------
// Les macros saisies doivent retomber sur les calories annoncées.
// 4 kcal par gramme de protéines et de glucides, 9 pour les lipides.
// Un écart de plus de 3 % vient presque toujours d'une faute de
// frappe : mieux vaut le voir ici que dans la boîte du client.
function controler() {
  var k = +$("kcal").value, p = +$("prot").value,
      c = +$("carbs").value, l = +$("lip").value;
  var el = $("controle");
  if (!k || !p || !c || !l) { el.textContent = ""; return; }
  var calcule = p * 4 + c * 4 + l * 9;
  var ecart = Math.round(((calcule - k) / k) * 100);
  if (Math.abs(ecart) <= 3) {
    el.textContent = "Cohérent : les macros donnent " + Math.round(calcule) + " kcal.";
    el.style.color = "#1C5334";
  } else {
    el.textContent = "Attention : les macros donnent " + Math.round(calcule) +
      " kcal, soit " + (ecart > 0 ? "+" : "") + ecart + " % par rapport aux " + k + " annoncées.";
    el.style.color = "#8A2318";
  }
}
["kcal", "prot", "carbs", "lip"].forEach(function (id) {
  $(id).addEventListener("input", controler);
});

// --- Connexion ------------------------------------------------
$("btnConnexion").addEventListener("click", function () {
  var b = $("btnConnexion");
  b.disabled = true;
  auth.signInWithEmailAndPassword($("cEmail").value.trim(), $("cMdp").value)
    .catch(function () {
      afficher($("msgCo"), "Adresse ou mot de passe incorrect.", false);
    })
    .finally(function () { b.disabled = false; });
});

$("btnDeco").addEventListener("click", function (e) {
  e.preventDefault();
  auth.signOut();
});

auth.onAuthStateChanged(function (u) {
  $("connexion").style.display = u ? "none" : "block";
  $("travail").style.display = u ? "block" : "none";
  $("qui").textContent = u ? (u.email || "") : "";
});

// --- Dépôt ----------------------------------------------------
$("btnEnvoi").addEventListener("click", function () {
  var b = $("btnEnvoi"), msg = $("msg"), recap = $("recap");
  recap.className = "recap";
  msg.className = "msg";

  var corps = {
    client: $("client").value.trim(),
    kcal: +$("kcal").value,
    prot: +$("prot").value,
    carbs: +$("carbs").value,
    lip: +$("lip").value,
    note: $("note").value.trim(),
    langue: ($("langue").value || "fr").trim().toLowerCase()
  };
  if (!corps.client) { afficher(msg, "Indique le client.", false); return; }
  if (!corps.kcal || !corps.prot || !corps.carbs || !corps.lip) {
    afficher(msg, "Toutes les valeurs sont nécessaires.", false); return;
  }

  b.disabled = true;
  b.textContent = "Envoi…";

  auth.currentUser.getIdToken()
    .then(function (jeton) {
      return fetch(URL_DEPOT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + jeton
        },
        body: JSON.stringify(corps)
      });
    })
    .then(function (r) { return r.json().then(function (d) { return {r: r, d: d}; }); })
    .then(function (x) {
      if (x.d && x.d.ok) {
        afficher(msg, x.d.mailEnvoye
          ? "Programme déposé. L'e-mail est parti."
          : "Programme déposé dans l'application. L'e-mail n'a pas pu partir — le client le voit quand même.", true);
        recap.className = "recap on";
        recap.innerHTML =
          '<div class="recap-l"><em>Client</em><span>' +
            (x.d.client.email || x.d.client.uid) + '</span></div>' +
          '<div class="recap-l"><em>Calories</em><span>' + corps.kcal + ' kcal</span></div>' +
          '<div class="recap-l"><em>Macros</em><span>' + corps.prot + ' / ' +
            corps.carbs + ' / ' + corps.lip + ' g</span></div>';
        $("note").value = "";
      } else {
        var m = x.d && x.d.motif;
        afficher(msg,
          m === "acces" ? "Ce compte n'est pas coach." :
          m === "introuvable" ? "Aucun client avec cet e-mail ou ce pseudo." :
          m === "valeurs" ? "Une des valeurs est hors des bornes acceptées." :
          m === "client" ? "Indique le client." :
          "Le dépôt a échoué. Réessaie.", false);
      }
    })
    .catch(function () { afficher(msg, "Réseau indisponible.", false); })
    .finally(function () { b.disabled = false; b.textContent = "Déposer et envoyer"; });
});
</script>
</body>
</html>
