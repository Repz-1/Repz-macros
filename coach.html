<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F3F0">
<title>Espace coach — BELFIT</title>
<link rel="icon" href="/favicon-32-v9.png">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ESPACE COACH — composition d'un programme.
   Hors de l'application : elle n'a rien a faire dans le bundle
   client. L'acces est verifie cote serveur par deposerProgramme —
   ce que cette page montre ou cache n'est qu'un confort.
   Meme matiere que l'app : creme, cartes blanches, graphite pour
   l'action qui engage.
   ============================================================ */
:root{
  --fond:#F4F3F0; --carte:#fff; --bord:rgba(28,24,18,.055);
  --filet:rgba(28,24,18,.07);
  --tx:#16130F; --tx2:#57514A; --tx3:#8A8279;
  --or:#F86A0C; --or-lis:#B34700;
  --omb:0 1px 2px rgba(40,32,22,.04), 0 3px 10px rgba(40,32,22,.035);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--tx);
  font-family:'Satoshi','Manrope',system-ui,sans-serif}
.enveloppe{max-width:540px;margin:0 auto;padding:22px 16px 80px}
header{display:flex;align-items:center;gap:10px;padding:4px 0 18px}
header img{height:32px;width:auto;display:block}
header b{font-size:15px;font-weight:600;letter-spacing:-.01em}
header span{margin-left:auto;font-size:11.5px;color:var(--tx3)}
h1{margin:0 0 4px;font-size:27px;font-weight:700;letter-spacing:-.035em}
.sous{margin:0 0 18px;font-size:14px;line-height:1.45;color:var(--tx2)}
.lb{font-size:10px;font-weight:700;letter-spacing:.16em;color:var(--tx3);
  text-transform:uppercase;margin:22px 0 8px}
.carte{background:var(--carte);border:1px solid var(--bord);
  border-radius:18px;box-shadow:var(--omb);padding:15px;margin-bottom:11px}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;
  color:var(--tx3);text-transform:uppercase;margin-bottom:6px}
input,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);
  background:#FFFDF9;border:1px solid #EDE5D8;border-radius:12px;
  padding:11px 12px;outline:none}
input:focus,textarea:focus{border-color:rgba(248,106,12,.38);
  box-shadow:0 0 0 2.5px rgba(248,106,12,.09)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
.aide{margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--tx3)}

.repas{background:var(--carte);border:1px solid var(--bord);border-radius:18px;
  box-shadow:var(--omb);margin-bottom:11px;overflow:visible}
.repas-tete{display:flex;align-items:center;gap:9px;padding:13px 14px;
  border-bottom:1px solid var(--filet)}
.repas-tete input{border:none;background:none;padding:0;font-size:15.5px;
  font-weight:600;flex:1}
.repas-tete input:focus{box-shadow:none}
.repas-kcal{font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.jeter{border:none;background:none;padding:4px;cursor:pointer;color:var(--tx3);
  font-size:19px;line-height:1;width:auto}
.ing{display:flex;align-items:center;gap:9px;padding:9px 14px;
  border-bottom:1px solid var(--filet);font-size:14px}
.ing-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ing-qte{width:74px;flex:none}
.ing-qte input{text-align:right;padding:7px 8px;font-size:14px;font-weight:600}
.ing-u{font-size:12px;color:var(--tx3);width:26px}
.ing-kcal{font-size:12px;color:var(--tx3);width:52px;text-align:right;
  font-variant-numeric:tabular-nums}
.ajout{position:relative;padding:11px 14px}
.ajout input{font-size:14px}
.propositions{position:absolute;z-index:20;left:14px;right:14px;top:46px;
  max-height:230px;overflow:auto;background:#fff;border:1px solid var(--bord);
  border-radius:13px;box-shadow:0 10px 30px rgba(40,32,22,.14);display:none}
.propositions.on{display:block}
.propositions button{display:block;width:100%;text-align:left;background:none;
  border:none;border-bottom:1px solid var(--filet);padding:11px 13px;
  font:inherit;font-size:14px;color:var(--tx);cursor:pointer}
.propositions button:hover,.propositions button:focus{background:#FBF7F2}
.propositions em{font-style:normal;color:var(--tx3);font-size:12px;float:right}
.plus{display:block;width:100%;padding:12px;margin-bottom:14px;font:inherit;
  font-size:14px;font-weight:600;color:var(--or-lis);cursor:pointer;
  background:#fff;border:1px dashed rgba(179,71,0,.34);border-radius:14px}

.total{background:linear-gradient(168deg,#252B36,#1E232D 58%,#171C24);
  border-radius:18px;padding:16px;color:#F4F6F8;margin-bottom:14px}
.total-k{font-size:29px;font-weight:700;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums}
.total-k em{font-style:normal;font-size:13px;color:#AAB1BC;font-weight:500;
  margin-left:5px}
.total-m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px;
  padding-top:13px;border-top:1px solid rgba(255,255,255,.09)}
.total-m div{text-align:center}
.total-m b{display:block;font-size:16px;font-weight:650;
  font-variant-numeric:tabular-nums}
.total-m span{display:block;font-size:10.5px;color:#AAB1BC;margin-top:2px}

button.principal{display:block;width:100%;font:inherit;font-size:15px;
  font-weight:600;cursor:pointer;color:#F4F6F8;border:none;border-radius:14px;
  padding:15px;background:linear-gradient(168deg,#252B36,#1E232D 58%,#171C24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 6px rgba(18,22,28,.16)}
button.principal:disabled{opacity:.5;cursor:default}
.msg{margin-top:14px;padding:13px 14px;border-radius:13px;font-size:13.5px;
  line-height:1.5;display:none}
.msg.ok{display:block;background:#E9F5EE;color:#1C5334;
  box-shadow:inset 0 0 0 1px rgba(28,83,52,.12)}
.msg.ko{display:block;background:#FDECEA;color:#8A2318;
  box-shadow:inset 0 0 0 1px rgba(138,35,24,.12)}
.deco{text-align:center;margin-top:20px;font-size:12px}
.deco a{color:var(--or-lis);font-weight:600}


/* Plateforme coach (27/09) : sans compte, code personnel */
#ecranCode,#ecranTravail{display:none}
header a.quitter{margin-left:auto;font-size:12px;color:var(--tx3);text-decoration:none}
.dos{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;
  padding:12px 0;border-bottom:1px solid var(--filet);font:inherit;text-align:left;cursor:pointer;color:var(--tx)}
.dos-bloc:last-child .dos{border-bottom:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:#FDF1CC;color:#8F6200;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.dos-txt{flex:1;min-width:0}
.dos-nom{font-size:15px;font-weight:600}
.dos-sous{font-size:12px;color:var(--tx3);margin-top:2px}
.tag{flex:none;font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 9px;background:#F1EFE8;color:#5F5E5A}
.tag.rouge{background:#FCEBEB;color:#A32D2D}.tag.ambre{background:#FAEEDA;color:#854F0B}.tag.vert{background:#E9F5EE;color:#1C5334}
.detail{padding:4px 0 14px;border-bottom:1px solid var(--filet)}
.detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sec{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;margin:14px 0 4px}
.rl{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--tx2);padding:4px 0;line-height:1.4}
.rl b{color:var(--tx);font-weight:600;text-align:right;max-width:55%}
.chip{display:flex;align-items:center;gap:10px;background:#FFF8E1;border-radius:12px;padding:10px 12px;font-size:14px}
.chip b{flex:1}
.chip button{border:0;background:none;font-size:18px;color:var(--tx3);cursor:pointer}
.vide{font-size:13.5px;color:var(--tx3);padding:10px 0;margin:0}
.ia{background:#1E232D;color:#F4F6F8;border-radius:18px;padding:15px;margin-bottom:11px}
.ia label{color:#AAB1BC}
.ia textarea{background:#2A303B;border-color:#3A414D;color:#F4F6F8;min-height:60px}
.ia button{display:block;width:100%;margin-top:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  border:0;border-radius:12px;padding:12px;background:#F8CF01;color:#191919}
.ia button:disabled{opacity:.6;cursor:default}
.cible{font-size:13px;color:var(--tx2);background:#FFF8E1;border-radius:12px;padding:10px 12px;margin-bottom:11px;line-height:1.5}
.cible b{color:var(--tx)}
button.ia-go{display:block;width:100%;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  color:#191919;background:#F8CF01;border:0;border-radius:12px;padding:12px;margin-top:12px}
button.second{display:block;width:100%;font:inherit;font-size:14px;font-weight:600;cursor:pointer;
  color:var(--tx);background:#FFF8E1;border:0;border-radius:12px;padding:12px;margin-top:12px}
</style>
</head>
<body>
<!-- ============================================================
     ESPACE COACH (27/09) : plateforme de Raci, sans compte BELFIT.
     Un code personnel, demande une fois par appareil, verifie par le
     serveur (fonction espaceCoach) a chaque appel.
     ============================================================ -->
<div class="enveloppe">

  <section id="ecranCode">
    <header><img src="/belfit-logo-bf.png" alt="BELFIT"><b>Espace coach</b></header>
    <h1>Espace coach</h1>
    <p class="sous">Entre ton code. Il est demandé une seule fois sur cet appareil.</p>
    <div class="carte">
      <label for="code">Code</label>
      <input id="code" type="password" autocomplete="current-password">
    </div>
    <button class="principal" id="btnCode">Entrer</button>
    <div id="msgCode" class="msg"></div>
  </section>

  <section id="ecranTravail">
    <header><img src="/belfit-logo-bf.png" alt="BELFIT"><b>Espace coach</b><a href="#" class="quitter" id="btnQuitter">Quitter</a></header>
    <h1>Bonjour Raci</h1>
    <p class="sous" id="resume">Chargement…</p>

    <p class="lb">À traiter</p>
    <div class="carte" id="aTraiter" style="padding:0 15px"></div>

    <div id="blocLivres">
      <p class="lb">Livrés</p>
      <div class="carte" id="livres" style="padding:0 15px"></div>
    </div>

    <p class="lb" id="ancreComposer">Envoyer un programme</p>
    <div class="carte">
      <label for="client">Destinataire</label>
      <div id="choisi" class="chip" style="display:none"><b id="choisiNom"></b><button id="btnDeselect" aria-label="Changer de destinataire">×</button></div>
      <input id="client" type="text" placeholder="e-mail ou pseudo" autocapitalize="off" spellcheck="false">
      <p class="aide">Touche un questionnaire plus haut pour le remplir tout seul.</p>
    </div>

    <p class="lb">Les repas</p>
    <div id="iaEtat" class="msg"></div>
    <div id="cible" class="cible" style="display:none"></div>
    <div id="repas"></div>
    <button class="plus" id="btnRepas">+ Ajouter un repas</button>
    <div class="total" id="total"></div>
    <div class="ia">
      <label for="demande">Demande à l'IA</label>
      <textarea id="demande" maxlength="600" placeholder="Ex. : plus de protéines le matin, remplace le riz par des pâtes, vise 2 200 kcal…"></textarea>
      <button id="btnAjuster">Ajuster avec l'IA</button>
      <div id="msgIa" class="msg"></div>
    </div>
    <div class="carte">
      <label for="note">Note pour le client</label>
      <textarea id="note" maxlength="600" placeholder="Facultatif — durée du plan, contexte, prochaine étape…"></textarea>
    </div>
    <button class="principal" id="btnEnvoi">Envoyer · app + e-mail</button>
    <div id="msg" class="msg"></div>
  </section>

</div>

<script type="module">
// Base d'aliments de l'app (meme fichier) : memes calories chez le client.
import { DB, NOMS_ALIMENTS, macrosOf } from '/app-v2/src/data/aliments.js';

const URL_COACH = 'https://europe-west1-repz-baf60.cloudfunctions.net/espaceCoach';
const CLE = 'belfit_espace_coach';
const $ = (id) => document.getElementById(id);
let code = '';
try { code = localStorage.getItem(CLE) || ''; } catch (e) { /* rien */ }
let choisi = null;   // dossier selectionne (destinataire)

let plan = [
  { nom: 'Repas 1', ings: [] },
  { nom: 'Repas 2', ings: [] },
];

const arrondi = (n) => Math.round(n);

function totalRepas(r) {
  return r.ings.reduce((t, i) => {
    const m = macrosOf(i);
    return { kcal: t.kcal + m.kcal, prot: t.prot + m.prot,
             carbs: t.carbs + m.carbs, lip: t.lip + m.lip };
  }, { kcal: 0, prot: 0, carbs: 0, lip: 0 });
}

function totalPlan() {
  return plan.reduce((t, r) => {
    const m = totalRepas(r);
    return { kcal: t.kcal + m.kcal, prot: t.prot + m.prot,
             carbs: t.carbs + m.carbs, lip: t.lip + m.lip };
  }, { kcal: 0, prot: 0, carbs: 0, lip: 0 });
}

/** Unite d'un aliment : piece pour les oeufs et les doses, gramme sinon. */
function unite(nom) {
  const d = DB[nom];
  return d && d.unit ? (d.unitLabel || 'p') : 'g';
}

function dessiner() {
  const hote = $('repas');
  hote.innerHTML = '';

  plan.forEach((r, ri) => {
    const bloc = document.createElement('div');
    bloc.className = 'repas';

    const t = totalRepas(r);
    const tete = document.createElement('div');
    tete.className = 'repas-tete';
    const champNom = document.createElement('input');
    champNom.value = r.nom;
    champNom.setAttribute('aria-label', 'Nom du repas');
    champNom.addEventListener('input', (e) => { plan[ri].nom = e.target.value; });
    const kc = document.createElement('span');
    kc.className = 'repas-kcal';
    kc.textContent = arrondi(t.kcal) + ' kcal';
    const jeterR = document.createElement('button');
    jeterR.className = 'jeter';
    jeterR.title = 'Retirer ce repas';
    jeterR.textContent = '\u00d7';
    jeterR.addEventListener('click', () => { plan.splice(ri, 1); dessiner(); });
    tete.append(champNom, kc, jeterR);
    bloc.appendChild(tete);

    r.ings.forEach((ing, ii) => {
      const m = macrosOf(ing);
      const l = document.createElement('div');
      l.className = 'ing';

      const nom = document.createElement('span');
      nom.className = 'ing-nom';
      nom.textContent = ing.name;

      const boite = document.createElement('span');
      boite.className = 'ing-qte';
      const q = document.createElement('input');
      q.type = 'number'; q.min = '0'; q.value = ing.portion;
      q.setAttribute('aria-label', 'Quantité');
      q.addEventListener('input', (e) => {
        plan[ri].ings[ii].portion = Math.max(0, +e.target.value || 0);
        rafraichirTotaux();
      });
      boite.appendChild(q);

      const u = document.createElement('span');
      u.className = 'ing-u'; u.textContent = unite(ing.name);

      const k = document.createElement('span');
      k.className = 'ing-kcal'; k.textContent = arrondi(m.kcal);

      const jeterI = document.createElement('button');
      jeterI.className = 'jeter'; jeterI.title = 'Retirer';
      jeterI.textContent = '\u00d7';
      jeterI.addEventListener('click', () => {
        plan[ri].ings.splice(ii, 1); dessiner();
      });

      l.append(nom, boite, u, k, jeterI);
      bloc.appendChild(l);
    });

    const zone = document.createElement('div');
    zone.className = 'ajout';
    const champ = document.createElement('input');
    champ.type = 'text';
    champ.placeholder = 'Ajouter un aliment\u2026';
    champ.autocapitalize = 'off'; champ.spellcheck = false;
    const liste = document.createElement('div');
    liste.className = 'propositions';

    const proposer = () => {
      const q = champ.value.trim().toLowerCase();
      liste.innerHTML = '';
      if (q.length < 2) { liste.className = 'propositions'; return; }
      // Recherche par mots : « riz cru » trouve « Riz cru » comme
      // « Riz basmati cru ». Meme logique que la recherche de l'app.
      const mots = q.split(/\s+/);
      const trouves = NOMS_ALIMENTS.filter((n) => {
        const b = n.toLowerCase();
        return mots.every((mo) => b.includes(mo));
      }).slice(0, 12);
      if (!trouves.length) { liste.className = 'propositions'; return; }
      trouves.forEach((n) => {
        const b = document.createElement('button');
        b.type = 'button';
        const e = document.createElement('em');
        e.textContent = DB[n].kcal + ' kcal / ' + (DB[n].unit ? '1 ' + unite(n) : '100 g');
        b.textContent = n;
        b.appendChild(e);
        b.addEventListener('click', () => {
          plan[ri].ings.push({ name: n, portion: DB[n].unit ? 1 : 100 });
          dessiner();
        });
        liste.appendChild(b);
      });
      liste.className = 'propositions on';
    };
    champ.addEventListener('input', proposer);
    // Le delai laisse le temps au clic d'aboutir : sans lui, le blur
    // fermerait la liste avant que le bouton ne recoive l'evenement.
    champ.addEventListener('blur', () => setTimeout(() => {
      liste.className = 'propositions';
    }, 180));
    zone.append(champ, liste);
    bloc.appendChild(zone);

    hote.appendChild(bloc);
  });

  rafraichirTotaux();
}

/** Totaux sans redessiner : le champ en cours garde le focus. */
function rafraichirTotaux() {
  document.querySelectorAll('.repas').forEach((bloc, ri) => {
    if (!plan[ri]) return;
    const t = totalRepas(plan[ri]);
    const el = bloc.querySelector('.repas-kcal');
    if (el) el.textContent = arrondi(t.kcal) + ' kcal';
    bloc.querySelectorAll('.ing').forEach((l, ii) => {
      const k = l.querySelector('.ing-kcal');
      if (k && plan[ri].ings[ii]) {
        k.textContent = arrondi(macrosOf(plan[ri].ings[ii]).kcal);
      }
    });
  });
  const T = totalPlan();
  $('total').innerHTML =
    '<div class="total-k">' + arrondi(T.kcal) + '<em>kcal par jour</em></div>' +
    '<div class="total-m">' +
      '<div><b>' + arrondi(T.prot) + ' g</b><span>protéines</span></div>' +
      '<div><b>' + arrondi(T.carbs) + ' g</b><span>glucides</span></div>' +
      '<div><b>' + arrondi(T.lip) + ' g</b><span>lipides</span></div>' +
    '</div>';
}

$('btnRepas').addEventListener('click', () => {
  plan.push({ nom: 'Repas ' + (plan.length + 1), ings: [] });
  dessiner();
});

function afficher(el, texte, ok) {
  el.textContent = texte;
  el.className = 'msg ' + (ok ? 'ok' : 'ko');
}

function appel(action, extra) {
  return fetch(URL_COACH, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code, action, ...(extra || {}) }),
  }).then((r) => r.json().catch(() => ({ ok: false })).then((d) => {
    if (d && d.motif === 'code') { oublier('Code refusé.'); throw new Error('code'); }
    return d;
  }));
}

function ecran(nom) {
  $('ecranCode').style.display = nom === 'code' ? 'block' : 'none';
  $('ecranTravail').style.display = nom === 'travail' ? 'block' : 'none';
}

function oublier(msg) {
  code = '';
  try { localStorage.removeItem(CLE); } catch (e) { /* rien */ }
  ecran('code');
  if (msg) afficher($('msgCode'), msg, false);
}

// ---------- Dossiers ----------
const H48 = 48 * 3600 * 1000;
function quand(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('fr-BE', { weekday: 'short', day: 'numeric', month: 'short' }) +
    ' à ' + d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0');
}
function nomDe(d) { return [d.prenom, d.nom].filter(Boolean).join(' ') || d.email || 'Client'; }
function initiales(d) {
  const n = nomDe(d).split(/[\s@.]+/).filter(Boolean);
  return ((n[0] || '?')[0] + ((n[1] || '')[0] || '')).toUpperCase();
}
function echeance(d) {
  if (d.payeLe && d.envoyeLe && (new Date(d.envoyeLe) - new Date(d.payeLe)) >= 7 * 86400000) return ['File', ''];
  const reste = Math.round((new Date(d.envoyeLe).getTime() + H48 - Date.now()) / 3600000);
  if (reste < 0) return ['En retard', 'rouge'];
  return [reste + ' h', reste <= 24 ? 'rouge' : 'ambre'];
}

function el(tag, cls, texte) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (texte != null) e.textContent = texte;
  return e;
}

function detail(d) {
  const box = el('div', 'detail');
  const tags = el('div', 'tags');
  tags.append(el('span', 'tag', d.type === 'maj' ? 'Mise à jour' : 'Premier plan'));
  if (d.alerteSante) tags.append(el('span', 'tag rouge', 'Point de santé'));
  if (d.allergieGrave) tags.append(el('span', 'tag rouge', 'Allergie grave'));
  box.append(tags);
  if (d.email) box.append(el('p', 'dos-sous', d.email));
  const groupes = {};
  Object.values(d.reponses || {}).forEach((r) => {
    if (!r || !r.question) return;
    (groupes[r.section || 'Réponses'] = groupes[r.section || 'Réponses'] || []).push(r);
  });
  Object.keys(groupes).forEach((s) => {
    box.append(el('p', 'sec', s));
    groupes[s].forEach((r) => {
      const l = el('div', 'rl');
      l.append(el('span', '', r.question), el('b', '', r.texte || ''));
      box.append(l);
    });
  });
  const ia = el('button', 'ia-go', 'Proposer un plan avec l\'IA');
  ia.addEventListener('click', () => { choisir(d); proposer({ uid: d.uid }); });
  const b = el('button', 'second', 'Composer moi-même');
  b.addEventListener('click', () => choisir(d));
  box.append(ia, b);
  return box;
}

function ligne(d, aTraiter) {
  const bloc = el('div', 'dos-bloc');
  const b = el('button', 'dos');
  const txt = el('span', 'dos-txt');
  txt.append(el('div', 'dos-nom', nomDe(d)),
    el('div', 'dos-sous', (d.objectif ? d.objectif + ' · ' : '') + (aTraiter ? 'reçu ' + quand(d.envoyeLe) : 'livré ' + quand(d.livreLe))));
  const [t, c] = aTraiter ? echeance(d) : ['Livré', 'vert'];
  b.append(el('span', 'av', initiales(d)), txt, el('span', 'tag ' + c, t));
  let ouvert = null;
  b.addEventListener('click', () => {
    if (ouvert) { ouvert.remove(); ouvert = null; return; }
    ouvert = detail(d); bloc.append(ouvert);
  });
  bloc.append(b);
  return bloc;
}

function chargerDossiers() {
  return appel('dossiers').then((r) => {
    if (!r || !r.ok) { $('resume').textContent = 'Impossible de charger les questionnaires.'; return; }
    const a = r.dossiers.filter((d) => d.aTraiter);
    const l = r.dossiers.filter((d) => !d.aTraiter).slice(0, 10);
    $('resume').textContent = a.length ? a.length + ' questionnaire' + (a.length > 1 ? 's' : '') + ' à traiter' : 'Aucun questionnaire à traiter';
    const hA = $('aTraiter'); hA.innerHTML = '';
    if (!a.length) hA.append(el('p', 'vide', 'Rien pour le moment.'));
    a.sort((x, y) => new Date(x.envoyeLe) - new Date(y.envoyeLe)).forEach((d) => hA.append(ligne(d, true)));
    const hL = $('livres'); hL.innerHTML = '';
    $('blocLivres').style.display = l.length ? 'block' : 'none';
    l.forEach((d) => hL.append(ligne(d, false)));
  }).catch(() => {});
}

function choisir(d) {
  choisi = d;
  $('choisiNom').textContent = nomDe(d) + (d.email ? ' · ' + d.email : '');
  $('choisi').style.display = 'flex';
  $('client').style.display = 'none';
  $('ancreComposer').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
$('btnDeselect').addEventListener('click', () => {
  choisi = null;
  $('choisi').style.display = 'none';
  $('client').style.display = 'block';
});

// ---------- IA (Gemini, via le serveur) ----------
const r1 = (x) => Math.round((+x || 0) * 10) / 10;
const LISTE = NOMS_ALIMENTS.map((n) => {
  const d = DB[n];
  return [n, r1(d.kcal), r1(d.prot), r1(d.carbs), r1(d.lip)].join(';') + (d.unit ? ';pièce=' + d.unit + 'g' : '');
});

// Etat de l'IA affiche EN HAUT des repas (27/09) : c'est la que la page
// defile ; en bas, Raci ne voyait ni l'attente ni l'erreur.
function proposer(extra) {
  const msg = $('iaEtat'), b = $('btnAjuster');
  b.disabled = true; b.textContent = 'L\'IA prépare le plan…';
  document.querySelectorAll('.ia-go').forEach((x) => { x.disabled = true; x.textContent = 'L\'IA prépare le plan…'; });
  $('msgIa').className = 'msg';
  afficher(msg, 'L\'IA prépare le plan… (15 à 30 secondes)', true);
  $('ancreComposer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  return appel('proposer', { aliments: LISTE, ...extra }).then((d) => {
    if (d && d.ok) {
      plan = d.repas.map((r) => ({ nom: r.nom, ings: r.ings.map((i) => ({ name: i.name, portion: i.portion })) }));
      dessiner();
      if (d.cible) {
        $('cible').innerHTML = 'Cible calculée : <b>' + d.cible.kcal + ' kcal</b> · P ' + d.cible.prot + ' g · G ' + d.cible.carbs + ' g · L ' + d.cible.lip + ' g';
        $('cible').style.display = 'block';
      }
      afficher(msg, (d.remarque ? d.remarque + ' ' : '') + 'Relis tout avant d\'envoyer, surtout les allergies.', true);
    } else {
      afficher(msg, d && d.motif === 'credit' ? 'Le crédit Gemini est épuisé : recharge-le sur ai.studio/projects (Facturation), puis réessaie.'
        : d && d.motif === 'vide' ? 'Choisis un questionnaire ou compose d\'abord un plan.'
        : 'L\'IA n\'a pas pu répondre. Réessaie.' + (d && (d.detail || d.motif) ? ' (' + (d.detail || d.motif) + ')' : ''), false);
    }
  }).catch((e) => { if (e.message !== 'code') afficher(msg, 'Réseau indisponible ou délai dépassé. Réessaie.', false); })
    .finally(() => {
      b.disabled = false; b.textContent = 'Ajuster avec l\'IA';
      document.querySelectorAll('.ia-go').forEach((x) => { x.disabled = false; x.textContent = 'Proposer un plan avec l\'IA'; });
    });
}

$('btnAjuster').addEventListener('click', () => {
  const demande = $('demande').value.trim();
  const planActuel = plan.filter((r) => r.ings.length).map((r) => ({ nom: r.nom, ings: r.ings }));
  if (!demande && !choisi && !planActuel.length) {
    afficher($('msgIa'), 'Écris une demande, ou choisis un questionnaire plus haut.', false); return;
  }
  proposer({ uid: choisi ? choisi.uid : null, demande, planActuel });
});

// ---------- Entree ----------
$('btnCode').addEventListener('click', () => {
  const b = $('btnCode');
  code = $('code').value.trim();
  if (!code) return;
  b.disabled = true;
  appel('verifier').then((r) => {
    if (r && r.ok) {
      try { localStorage.setItem(CLE, code); } catch (e) { /* rien */ }
      ouvrir();
    } else if (r && r.motif === 'attente') {
      afficher($('msgCode'), 'Trop d\'essais. Réessaie dans 15 minutes.', false);
    }
  }).catch((e) => { if (e.message !== 'code') afficher($('msgCode'), 'Réseau indisponible.', false); })
    .finally(() => { b.disabled = false; });
});
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnCode').click(); });
$('btnQuitter').addEventListener('click', (e) => { e.preventDefault(); oublier(); });

function ouvrir() { ecran('travail'); dessiner(); chargerDossiers(); }

$('btnEnvoi').addEventListener('click', () => {
  const b = $('btnEnvoi'), msg = $('msg');
  msg.className = 'msg';
  const client = choisi ? 'uid:' + choisi.uid : $('client').value.trim();
  if (!client) { afficher(msg, 'Indique le destinataire.', false); return; }
  const repas = plan.filter((r) => r.ings.length).map((r) => ({
    nom: (r.nom || '').trim() || 'Repas',
    ings: r.ings.map((i) => ({ name: i.name, portion: +i.portion || 0 })),
  }));
  if (!repas.length) { afficher(msg, 'Le programme est vide : ajoute au moins un aliment.', false); return; }
  const T = totalPlan();
  b.disabled = true; b.textContent = 'Envoi…';
  appel('deposer', {
    client, repas, note: $('note').value.trim(), langue: 'fr',
    kcal: arrondi(T.kcal), prot: arrondi(T.prot), carbs: arrondi(T.carbs), lip: arrondi(T.lip),
  }).then((d) => {
    if (d && d.ok) {
      afficher(msg, d.mailEnvoye ? 'Programme envoyé : dans l\'app et par e-mail.'
        : 'Programme déposé dans l\'app. L\'e-mail n\'a pas pu partir, le client le voit quand même.', true);
      chargerDossiers();
    } else {
      const m = d && d.motif;
      afficher(msg,
        m === 'introuvable' ? 'Aucun compte BELFIT avec cet e-mail ou ce pseudo.' :
        m === 'valeurs' ? 'Une valeur est hors des bornes (calories ou macros).' :
        m === 'repas' ? 'Le programme est vide.' :
        'L\'envoi a échoué. Réessaie.', false);
    }
  }).catch((e) => { if (e.message !== 'code') afficher(msg, 'Réseau indisponible.', false); })
    .finally(() => { b.disabled = false; b.textContent = 'Envoyer · app + e-mail'; });
});

if (code) ouvrir(); else ecran('code');
</script>
</body>
</html>
